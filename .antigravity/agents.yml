# 🤖 Antigravity Multi-Agent Config — Minbar Live

## orchestrator_agent
model: gemini-2.5-pro  # or claude-sonnet-4-5 — both supported
context_files:
  - CLAUDE.md          # Always loaded first
  - main_prompt.md     # Master task definitions
  - AGENT_HARNESS.md   # Behavioral rules
  - ARCHITECTURE.md    # System design
  - MODELS.md          # AI model choices
  - SKILLS.md          # External repos to use
  - PROGRESS.md        # Sprint state (read before each task)
  - ISSUES.md          # Existing decisions and issues

## sub_agent_defaults
branch_prefix: feature/agent-
commit_style: conventional
always_update_files:
  - PROGRESS.md        # Mark task done after completion
  - ISSUES.md          # Log any decisions or issues found

## execution_order
# Sequential unless marked [PARALLEL]
